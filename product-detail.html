<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conoce los detalles de nuestros productos para mascotas."
    />
    <title>Detalle del producto | Mokka Pets</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/product-detail.css" />
    <script type="module" src="/js/pages/product-detail.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a href="/index.html" class="logo">Mokka Pets</a>

      <nav aria-label="Navegación principal">
        <a href="/index.html">Inicio</a>
        <a href="/cart.html">Mi carrito</a>
        <a href="/login.html">Iniciar sesión</a>
      </nav>
    </header>

    <main class="product-detail-page">
      <a class="back-link" href="/index.html">← Volver al catálogo</a>

      <p id="detail-message" role="status" aria-live="polite">
        Cargando producto...
      </p>

      <section id="product-detail" class="product-detail" hidden>
        <div id="detail-image" class="detail-image"></div>

        <div class="detail-info">
          <p class="eyebrow">MOKKA PETS</p>
          <h1 id="detail-name"></h1>
          <p id="detail-price" class="detail-price"></p>
          <p id="detail-description"></p>
          <p id="detail-stock"></p>

          <div class="quantity-control">
            <label for="quantity">Cantidad</label>
            <input id="quantity" type="number" min="1" value="1" step="1" />
          </div>

          <button id="add-to-cart" class="button button-primary" type="button">
            Agregar al carrito
          </button>

          <p id="cart-message" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
  </body>
</html>
