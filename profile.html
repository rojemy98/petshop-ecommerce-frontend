<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Administra tu perfil en Mokka Pets." />
    <title>Mi perfil | Mokka Pets</title>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/auth.css" />

    <script type="module" src="/js/pages/profile.js"></script>
  </head>

  <body class="auth-page">
    <header class="site-header">
      <a class="brand" href="/index.html">
        <span class="brand-icon" aria-hidden="true">✿</span>
        Mokka <span class="brand-light">Pets</span>
      </a>

      <a class="text-link" href="/index.html">Volver al inicio</a>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <div class="auth-heading">
          <span class="auth-symbol" aria-hidden="true">♡</span>
          <p class="eyebrow">TU CUENTA</p>
          <h1>Mi perfil</h1>
          <p>Consulta y actualiza tu información personal.</p>
        </div>

        <form id="profile-form" novalidate>
          <div class="form-field">
            <label for="name">Nombre</label>
            <input
              id="name"
              name="name"
              type="text"
              maxlength="100"
              autocomplete="given-name"
              required
            />
          </div>

          <div class="form-field">
            <label for="last-name">Apellido</label>
            <input
              id="last-name"
              name="last_name"
              type="text"
              maxlength="100"
              autocomplete="family-name"
              required
            />
          </div>

          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              maxlength="150"
              autocomplete="email"
              required
            />
          </div>

          <p
            id="form-message"
            class="form-message"
            role="alert"
            aria-live="polite"
          ></p>

          <button
            id="save-profile-button"
            class="button button-primary auth-submit"
            type="submit"
          >
            Guardar cambios
          </button>
        </form>

        <p class="auth-footer">
          <a href="/index.html">Volver a la tienda</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Mokka Pets</span>
      <small>Todo lo bueno para quienes más quieres. ♡</small>
    </footer>
  </body>
</html>
