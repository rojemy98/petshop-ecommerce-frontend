<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi carrito | Mokka Pets</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/cart.css" />
    <script type="module" src="/js/pages/cart.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a href="/index.html" class="logo">Mokka Pets</a>

      <nav aria-label="Navegación principal">
        <a href="/index.html">Seguir comprando</a>
      </nav>
    </header>

    <main class="cart-page">
      <h1>Mi carrito</h1>

      <p id="cart-message" role="status" aria-live="polite"></p>

      <div id="cart-items" class="cart-items"></div>

      <section class="cart-summary">
        <h2>Resumen de compra</h2>
        <p>
          Subtotal:
          <strong id="cart-total">₡0,00</strong>
        </p>

        <button id="clear-cart" class="button button-secondary" type="button">
          Vaciar carrito
        </button>

        <button
          id="checkout-button"
          class="button button-primary"
          type="button"
        >
          Continuar con la compra
        </button>
      </section>
    </main>
  </body>
</html>
