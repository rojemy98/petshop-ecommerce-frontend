<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crea tu cuenta en Mokka Pets." />
    <title>Crear cuenta | Mokka Pets</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <script type="module" src="/js/pages/register.js"></script>
  </head>

  <body class="auth-page">
    <header class="site-header">
      <a class="brand" href="/index.html">
        <span class="brand-icon" aria-hidden="true">✿</span>
        Mokka <span class="brand-light">Pets</span>
      </a>
      <a class="text-link" href="/index.html">Volver al inicio</a>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <div class="auth-heading">
          <span class="auth-symbol" aria-hidden="true">♡</span>
          <p class="eyebrow">ÚNETE A MOKKA PETS</p>
          <h1>Crear una cuenta</h1>
          <p>Regístrate para comenzar a comprar para tus mascotas.</p>
        </div>

        <form id="register-form" novalidate>
          <div class="form-field">
            <label for="name">Nombre</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="given-name"
              maxlength="100"
              required
            />
          </div>

          <div class="form-field">
            <label for="last_name">Apellidos</label>
            <input
              id="last_name"
              name="last_name"
              type="text"
              autocomplete="family-name"
              maxlength="100"
              required
            />
          </div>

          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              placeholder="nombre@correo.com"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirmar contraseña</label>
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>

          <p
            id="form-message"
            class="form-message"
            role="alert"
            aria-live="polite"
          ></p>

          <button
            id="register-button"
            class="button button-primary auth-submit"
            type="submit"
          >
            Crear cuenta
          </button>
        </form>

        <p class="auth-footer">
          ¿Ya tienes una cuenta?
          <a href="/login.html">Iniciar sesión</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Mokka Pets</span>
      <small>Todo lo bueno para quienes más quieres. ♡</small>
    </footer>
  </body>
</html>
