<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicia sesión en Mokka Pets." />
    <title>Iniciar sesión | Mokka Pets</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <script type="module" src="/js/pages/login.js"></script>
  </head>
  <body class="auth-page">
    <header class="site-header">
      <a class="brand" href="/index.html">
        <span class="brand-icon" aria-hidden="true">✿</span>
        Mokka <span class="brand-light">Pets</span>
      </a>
      <a class="text-link" href="/index.html">Volver al inicio</a>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <div class="auth-heading">
          <span class="auth-symbol" aria-hidden="true">♡</span>
          <p class="eyebrow">QUÉ BUENO TENERTE AQUÍ</p>
          <h1>Bienvenido de nuevo</h1>
          <p>Inicia sesión para continuar comprando para tus mascotas.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              placeholder="nombre@correo.com"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <p
            id="form-message"
            class="form-message"
            role="alert"
            aria-live="polite"
          ></p>

          <button
            id="login-button"
            class="button button-primary auth-submit"
            type="submit"
          >
            Iniciar sesión
          </button>
        </form>

        <p class="auth-footer">
          ¿Todavía no tienes una cuenta?
          <a href="/register.html">Crear cuenta</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Mokka Pets</span>
      <small>Todo lo bueno para quienes más quieres. ♡</small>
    </footer>
  </body>
</html>
