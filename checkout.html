<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resumen de pedido | Mokka Pets</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/cart.css" />
    <script type="module" src="/js/pages/checkout.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html"
        ><span class="brand-icon">✿</span
        ><span>Mokka <span class="brand-light">Pets</span></span></a
      >
      <nav>
        <a href="/cart.html" class="continue-shopping">Volver al carrito</a>
      </nav>
    </header>
    <main class="cart-page">
      <h1>Resumen de pedido</h1>
      <p id="checkout-message" role="status" aria-live="polite"></p>
      <section class="cart-summary">
        <h2>Productos</h2>
        <div id="checkout-items" class="cart-items"></div>
        <p>Subtotal: <strong id="checkout-total">₡0,00</strong></p>
      </section>
      <section class="checkout-section">
        <h2>Dirección de facturación</h2>
        <div class="form-group">
          <label for="billing-address">Dirección</label
          ><select id="billing-address">
            <option value="">Cargando direcciones...</option>
          </select>
        </div>
        <button type="button" id="show-address-form">
          Agregar nueva dirección
        </button>
        <form id="billing-address-form" hidden>
          <h3>Nueva dirección</h3>
          <div class="form-group">
            <label for="address">Dirección</label
            ><input id="address" name="address" required />
          </div>
          <div class="form-group">
            <label for="city">Ciudad</label
            ><input id="city" name="city" required />
          </div>
          <div class="form-group">
            <label for="province">Provincia</label
            ><input id="province" name="province" required />
          </div>
          <div class="form-group">
            <label for="postal-code">Código postal</label
            ><input
              id="postal-code"
              name="postal_code"
              inputmode="numeric"
              pattern="[0-9]+"
              required
            />
          </div>
          <div class="form-group">
            <label for="country">País</label
            ><input id="country" name="country" value="Costa Rica" required />
          </div>
          <button type="submit">Guardar dirección</button
          ><button type="button" id="cancel-address-form">Cancelar</button>
        </form>
      </section>
      <p class="checkout-note">
        Modo de demostración: no se realizará ningún cobro real.
      </p>
      <button id="confirm-checkout" class="button button-primary" type="button">
        Confirmar compra
      </button>
    </main>
  </body>
</html>
